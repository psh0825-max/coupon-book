<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="쿠폰북">
<meta name="description" content="쿠폰북 — 카페 도장판, 마사지 회수권, 금액권을 한곳에 모아 잔액과 만료일을 관리하는 개인 쿠폰 지갑. 계정 없이 내 기기에만 저장돼요.">
<title>쿠폰북</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/skins.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body data-theme="light">
<div id="app">
  <header class="header">
    <div class="header-side">
      <button class="header-btn" data-back hidden aria-label="뒤로">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <h1 class="header-title" data-page-title>쿠폰북</h1>
    <div class="header-side" aria-hidden="true"></div>
  </header>

  <main class="main" id="main">
    <section class="section active" id="home" aria-label="홈"></section>
    <section class="section" id="list" aria-label="내 이용권"></section>
    <section class="section" id="map" aria-label="지도"></section>
    <section class="section" id="add" aria-label="이용권 추가"></section>
    <section class="section" id="detail" aria-label="상세"></section>
    <section class="section" id="settings" aria-label="설정"></section>
    <section class="section" id="history" aria-label="사용 내역"></section>
    <section class="section" id="onboarding" aria-label="시작하기"></section>
  </main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="주요 메뉴">
    <button class="nav-item active" data-nav="home" role="tab" aria-selected="true" aria-label="홈">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>홈</span>
    </button>
    <button class="nav-item" data-nav="history" role="tab" aria-selected="false" aria-label="내역">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>내역</span>
    </button>
    <button class="nav-add" id="fab" data-fab aria-label="이용권 추가">
      <span class="nav-add-btn" aria-hidden="true">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </span>
      <span class="nav-add-label">추가</span>
    </button>
    <button class="nav-item" data-nav="map" role="tab" aria-selected="false" aria-label="지도">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>지도</span>
    </button>
    <button class="nav-item" data-nav="settings" role="tab" aria-selected="false" aria-label="설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>설정</span>
    </button>
  </nav>
</div>

<script>
// Boot guard: if the app has not rendered its first view within 6 s (a module
// failed to load, storage is broken, …) show what went wrong and a retry button
// instead of a silent blank screen. app.js marks data-booted once it navigates.
(function () {
  var errors = [];
  window.addEventListener('error', function (e) { errors.push((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { errors.push('promise: ' + (e.reason && (e.reason.message || e.reason))); });
  window.__bootErrors = errors;
  setTimeout(function () {
    if (document.body.dataset.booted === '1') return;
    var main = document.getElementById('home');
    if (!main) return;
    main.innerHTML = '<div class="empty-state wide"><h3>앱을 불러오지 못했어요</h3><p>' +
      (errors.length ? errors.slice(0, 3).map(function (m) { return String(m).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }).join('<br>') : '저장소를 준비하는 데 시간이 걸리고 있어요.') +
      '</p><div class="empty-actions"><button class="btn btn-primary" type="button" onclick="location.reload()">다시 시도</button></div></div>';
  }, 6000);
})();
</script>
<script src="vendor/qr/qrcode.js"></script>
<script src="vendor/barcode/JsBarcode.all.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
