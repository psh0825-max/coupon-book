org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 turns on R8 strict full mode, where `-keep class` rules no longer keep the default constructor.
# Room 2.2.5 (AdMob -> WorkManager 2.7.0) instantiates WorkDatabase_Impl reflectively, so the app crashed on start.
# Keep AGP 8 keep-rule semantics; R8 optimization and optimized resource shrinking stay on.
android.r8.strictFullModeForKeepRules=false
